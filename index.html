<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Safety net: only this page's own script and style may run, and the page may only talk to the three weather/place services -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src https://geocoding-api.open-meteo.com https://api.open-meteo.com https://api.bigdatacloud.net https://api-bdc.io; base-uri 'none'; form-action 'none'">
  <title>Weather Buddy</title>
  <!-- "?v=8" makes browsers fetch the new file when the version changes (GitHub Pages caches files for 10 minutes). Bump it with every release. -->
  <link rel="stylesheet" href="style.css?v=8">
</head>
<body>
  <!-- Words marked data-i18n are filled in by script.js in English or Dutch (F17) -->
  <main class="container">
    <h1>🌿 Weather Buddy</h1>
    <p class="subtitle" data-i18n="tagline">What should I wear today?</p>

    <!-- F1: type a city and search -->
    <form id="search-form">
      <input id="city-input" type="text" placeholder="Type a city, e.g. London" data-i18n-placeholder="placeholder" autocomplete="off">
      <button type="submit" data-i18n="search">Search</button>
    </form>

    <!-- F12: use my location -->
    <button type="button" id="location-button" class="location-button" data-i18n="useLocation">📍 Use my location</button>

    <!-- F8: °C / °F switch -->
    <div class="unit-switch" role="group" aria-label="Temperature unit" data-i18n-aria="unitLabel">
      <button type="button" id="unit-c" class="unit active">°C</button>
      <button type="button" id="unit-f" class="unit">°F</button>
    </div>

    <!-- F17: UK / NL language switch -->
    <div class="unit-switch" role="group" aria-label="Language" data-i18n-aria="langLabel">
      <button type="button" id="lang-en" class="unit active">UK</button>
      <button type="button" id="lang-nl" class="unit">NL</button>
    </div>

    <!-- F9: recent cities -->
    <div id="recent" class="recent" hidden></div>

    <!-- F4: friendly messages (errors and loading) show here -->
    <p id="message" class="message" hidden></p>

    <!-- F15: other places with the same name -->
    <div id="alternatives" class="alternatives" hidden></div>

    <!-- F2 + F3: results show here -->
    <section id="result" class="card" hidden>
      <h2 id="city-name"></h2>
      <div class="emoji" id="emoji"></div>
      <div class="temp" id="temp"></div>
      <div class="description" id="description"></div>

      <!-- F5: extra details -->
      <div class="details">
        <div><span id="feels"></span><small data-i18n="feels">Feels like</small></div>
        <div><span id="humidity"></span><small data-i18n="humidity">Humidity</small></div>
        <div><span id="wind"></span><small data-i18n="wind">Wind</small></div>
        <div><span id="rain"></span><small data-i18n="rain">Chance of rain</small></div>
      </div>

      <p class="advice" id="advice"></p>
    </section>

    <!-- F6: 7-day forecast -->
    <section id="forecast-section" hidden>
      <h3 data-i18n="forecastTitle">7-day forecast</h3>
      <div class="forecast" id="forecast"></div>
    </section>
  </main>

  <footer class="footer" data-i18n="footer">Weather Buddy · Version 8</footer>

  <script src="script.js?v=8"></script>
</body>
</html>
